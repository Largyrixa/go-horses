# Sobe o ambiente inteiro com:  docker compose up -d --build
#
# Uma única porta pública: 8088. A organização encaminha público 8088 -> VM:8080,
# então o Caddy publica a 8080 do host (a 8088 da VM não é exposta).
# O front e a API ficam na mesma origem, então o navegador chama caminhos relativos
# ("/api/...") e não existe CORS.
#
#   navegador ──► :8088 ──(NAT)──► VM:8080 ──► proxy (Caddy :8088)
#                                              ├─ /api/* ──► api (uvicorn :8088, sem o prefixo)
#                                              └─ resto   ──► front (nginx :8080, dist do Vite)
#                                            api ──► db (MySQL 8, sem porta pública)
#
# A porta 8028 pública é o SSH (-> VM:22): nenhum serviço usa essa porta.

services:
  proxy:
    image: caddy:2
    ports: ["8080:8088"]               # público 8088 -> VM 8080 -> Caddy 8088
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      front: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped

  front:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro   # pasta gerada por "npm run build"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ../backend                  # Dockerfile em backend/, app escuta em $PORT
    env_file: .env
    environment:
      PORT: "8088"
      DATABASE_URL: mysql://leilao:${DB_PASSWORD}@db:3306/leilao
      TZ: UTC
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Processo de fundo que abre/fecha leilões (RF17/RF18). Descomente quando existir.
  # Pode usar a mesma imagem da API com outro comando.
  # worker:
  #   build: ../backend
  #   command: ["<comando do worker>"]
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: mysql://leilao:${DB_PASSWORD}@db:3306/leilao
  #     TZ: UTC
  #   depends_on:
  #     db: { condition: service_healthy }
  #   restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: leilao
      MYSQL_USER: leilao
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - mysqldata:/var/lib/mysql
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro  # roda só na 1ª criação
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysqldata:
