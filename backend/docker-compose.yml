services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: leilao
      MYSQL_USER: leilao
      MYSQL_PASSWORD: leilao_secret
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uleilao", "-pleilao_secret"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: leilao
      DB_PASSWORD: leilao_secret
      DB_NAME: leilao
      PUBLIC_BASE_URL: http://localhost:8088
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
